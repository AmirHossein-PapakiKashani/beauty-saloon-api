name: Build BarberSalon

on:
  push:

jobs:
  build:
    runs-on: windows

    env:
      version: ""
      DEPLOY_PATH: |
       "C:\inetpub\wwwroot\luminous"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore src/BarberSalon.API/BarberSalon.API.csproj

      - name: Build
        run: dotnet build src/BarberSalon.API/BarberSalon.API.csproj --configuration Release --no-restore

      - name: Prepare deployment folder
        run: |
          if (Test-Path "$env:DEPLOY_PATH") {
              Remove-Item "$env:DEPLOY_PATH" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "$env:DEPLOY_PATH" -Force

          Write-Host "Deployment folder prepared:"
          Write-Host "$env:DEPLOY_PATH"

      - name: Publish
        run: dotnet publish src/BarberSalon.API/BarberSalon.API.csproj --configuration Release --output "$env:DEPLOY_PATH" --no-restore

      - name: Show published files
        run: Get-ChildItem "$env:DEPLOY_PATH" -Recurse