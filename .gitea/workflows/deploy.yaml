name: Build BarberSalon

on:
  push:

jobs:
  build:
    runs-on: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check .NET
        run: dotnet --info
      
      - name: Find N/A in project files
        run: Get-ChildItem -Path . -Recurse -File | Select-String -Pattern "N/A" | Select-Object Path, LineNumber, Line

   
      - name: Restore
        run: dotnet restore src/BarberSalon.API/BarberSalon.API.csproj

      - name: Build
        run: dotnet build src/BarberSalon.API/BarberSalon.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/BarberSalon.API/BarberSalon.API.csproj --configuration Release --output "$env:GITHUB_WORKSPACE\publish" --no-restore

      - name: Show published files
        run: Get-ChildItem "$env:GITHUB_WORKSPACE\publish" -Recurse